<style>
:root{
  --bg:#060a13;
  --card:rgba(255,255,255,.04);
  --card-border:rgba(255,255,255,.09);
  --text:#e6edf7;
  --muted:#8b98ad;
  --accent:#6ee7ff;
  --accent2:#a78bfa;
  --glow:rgba(110,231,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
::selection{background:var(--accent2);color:#0b0f1a}
a{color:var(--accent)}

#space{position:fixed;inset:0;z-index:0;pointer-events:none}
#glow{
  position:fixed;left:-9999px;top:-9999px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,var(--glow) 0%,transparent 65%);
  transform:translate(-50%,-50%);pointer-events:none;z-index:1;transition:opacity .4s;opacity:0;
}

/* nav */
nav{
  position:absolute;top:0;left:0;right:0;z-index:50;
  display:flex;justify-content:flex-end;gap:clamp(14px,3vw,30px);
  padding:18px clamp(18px,5vw,56px);
}
nav a{color:var(--muted);text-decoration:none;font-size:.88rem;letter-spacing:.2px;transition:color .2s}
nav a:hover,nav a:focus-visible{color:var(--text)}

main{position:relative;z-index:2}

/* hero */
.hero{
  min-height:min(100vh,960px);min-height:min(100svh,960px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:96px clamp(16px,5vw,40px) 64px;
}
h1{
  font-size:clamp(2.6rem,11vw,5.6rem);font-weight:800;letter-spacing:-.035em;line-height:1.02;
  text-align:center;margin-bottom:clamp(30px,5vh,46px);
  background:linear-gradient(100deg,#f4f8ff 10%,var(--accent) 45%,var(--accent2) 75%,#f0abfc);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 40px rgba(110,231,255,.18));
}
.chat{width:100%;max-width:720px}

/* composer */
#ask{
  display:flex;align-items:flex-end;gap:10px;
  padding:10px 10px 10px 22px;border-radius:28px;
  background:rgba(22,28,42,.72);border:1px solid rgba(255,255,255,.1);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:border-color .2s,box-shadow .2s;
}
#ask:focus-within{border-color:rgba(110,231,255,.35);box-shadow:0 10px 44px rgba(0,0,0,.4),0 0 0 4px rgba(110,231,255,.06)}
#q{
  flex:1;resize:none;border:none;outline:none;background:transparent;color:var(--text);
  font:inherit;font-size:1.02rem;line-height:1.5;padding:9px 0;max-height:168px;min-height:24px;
}
#q::placeholder{color:#76839a}
#send{
  flex:none;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  display:grid;place-items:center;background:var(--text);color:#060a13;
  transition:transform .15s,background .2s,opacity .2s;
}
#send:hover{transform:scale(1.06)}
#send:disabled{opacity:.35;cursor:default;transform:none}
#send svg{width:20px;height:20px}

/* the one exchange */
#ex{margin:22px 6px 0;display:flex;flex-direction:column;gap:12px}
#ex[hidden]{display:none}
#exq{
  align-self:flex-end;max-width:85%;padding:9px 16px;border-radius:18px 18px 4px 18px;
  background:rgba(255,255,255,.06);color:var(--muted);font-size:.9rem;overflow-wrap:anywhere;
}
#exa{font-size:1.06rem;line-height:1.7;color:var(--text);overflow-wrap:break-word;padding:0 4px}
#exa a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(110,231,255,.35);white-space:nowrap;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
#exa a:hover{border-bottom-color:var(--accent)}
#exa.err{color:#fca5a5;font-size:.95rem}
.dots{display:inline-flex;gap:6px;padding:8px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

/* get in touch */
.touch{display:flex;justify-content:center;gap:14px;margin-top:34px}
.touch a{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--muted);
  background:var(--card);border:1px solid var(--card-border);
  transition:color .2s,border-color .2s,transform .2s,box-shadow .2s;
}
.touch a:hover,.touch a:focus-visible{color:var(--accent);border-color:rgba(110,231,255,.45);
  transform:translateY(-3px);box-shadow:0 8px 26px rgba(110,231,255,.14)}
.touch svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* the wall */
#wall{max-width:1000px;margin:0 auto;padding:40px clamp(16px,5vw,40px) 0}
h2{font-size:clamp(1.4rem,3.5vw,1.9rem);font-weight:800;letter-spacing:-.5px;margin-bottom:22px;text-align:center}
#wallform{display:flex;gap:10px;flex-wrap:wrap;margin:0 auto 8px;max-width:720px}
#wallform input{
  flex:1;min-width:150px;padding:12px 16px;border-radius:12px;font:inherit;font-size:.9rem;
  background:var(--card);border:1px solid var(--card-border);color:var(--text);outline:none;
}
#wallform input:focus{border-color:rgba(110,231,255,.5)}
#wmsg{flex:3}
#wallbtn{
  padding:12px 22px;border-radius:12px;border:none;cursor:pointer;font:inherit;font-weight:600;font-size:.9rem;
  background:linear-gradient(90deg,var(--accent),var(--accent2));color:#081018;transition:transform .2s,box-shadow .2s;
}
#wallbtn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(110,231,255,.3)}
#wallbtn:disabled{opacity:.6;transform:none}
#wallstatus{color:var(--accent2);font-size:.84rem;text-align:center;min-height:1.5em;margin:0 auto 18px;max-width:720px}
#wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mark{padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--card-border);transform:rotate(var(--rot,0deg))}
.mark .who{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;
  font-family:ui-monospace,Menlo,monospace;font-size:.76rem;color:var(--accent)}
.mark .who span{color:var(--muted);font-size:.7rem;white-space:nowrap}
.mark p{color:var(--text);font-size:.88rem;overflow-wrap:break-word}

footer{position:relative;z-index:2;text-align:center;color:var(--muted);font-size:.78rem;
  padding:40px 20px;margin-top:80px;border-top:1px solid rgba(255,255,255,.05)}

@media (max-width:520px){
  nav{justify-content:center}
  nav a{font-size:.82rem}
  #ask{padding-left:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .dots i{opacity:.6}
}
</style>
</head>

<script>
(function(){
"use strict";
var ASK = "https://vk-brain.vaibhavpro9210.workers.dev/ask";
var GB = "https://guestbook.vaibhavpro9210.workers.dev";
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- aurora curtains over stars ---------- */
var cv = document.getElementById("space"), ctx = cv.getContext("2d");
var W, H, stars = [], mouse = {x:-9999, y:-9999};
var LAYERS = [
  {y:.16, amp:.05,  len:.30, sp:.8,  h1:160, h2:205, a:.085},
  {y:.24, amp:.07,  len:.24, sp:1.35,h1:185, h2:265, a:.075},
  {y:.10, amp:.045, len:.20, sp:1.0, h1:250, h2:300, a:.05}
];
var lastW = 0;
function resize(){
  var w = innerWidth;
  W = cv.width = w; H = cv.height = innerHeight;
  /* mobile toolbars fire height-only resizes while scrolling: keep the same stars */
  if (w !== lastW){
    lastW = w; stars = [];
    var n = Math.min(180, Math.floor(W*H/9000));
    for (var i=0;i<n;i++) stars.push({
      x:Math.random()*W, y:Math.random()*.85,
      r:Math.random()*1.3+.4, p:Math.random()*6.28, s:.4+Math.random()*1.2
    });
  }
  if (reduced) draw(60000);
}
function draw(t){
  ctx.clearRect(0,0,W,H);
  for (var i=0;i<stars.length;i++){
    var st = stars[i];
    ctx.globalAlpha = (.35+.65*Math.abs(Math.sin(t*.0006*st.s+st.p)))*.8;
    ctx.fillStyle = "#cfe4ff";
    ctx.fillRect(st.x, st.y*H, st.r, st.r);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "lighter";
  var step = 3;
  for (var L=0; L<LAYERS.length; L++){
    var c = LAYERS[L], ph = t*.0004*c.sp + L*2.1;
    for (var x=0; x<=W; x+=step){
      var n1 = Math.sin(x*.0038+ph) + .55*Math.sin(x*.0102-ph*1.7) + .3*Math.sin(x*.021+ph*.6);
      var m = Math.exp(-Math.pow(x-mouse.x,2)/64800);
      var yTop = (c.y + n1*c.amp)*H - m*26;
      var len = H*c.len*(.75+.25*Math.sin(x*.008-ph*1.3));
      var hue = c.h1 + (c.h2-c.h1)*(.5+.5*Math.sin(x*.0016+ph*.35));
      var a = c.a*(1+.9*m);
      var g = ctx.createLinearGradient(0, yTop, 0, yTop+len);
      g.addColorStop(0, "hsla("+hue+",90%,66%,"+a+")");
      g.addColorStop(.35, "hsla("+hue+",85%,60%,"+(a*.55)+")");
      g.addColorStop(1, "hsla("+hue+",80%,55%,0)");
      ctx.fillStyle = g;
      ctx.fillRect(x, yTop, step, len);
    }
  }
  ctx.globalCompositeOperation = "source-over";
}
addEventListener("resize", resize); resize();
if (!reduced){ draw(0); (function loop(t){ draw(t||0); requestAnimationFrame(loop); })(0); }

/* ---------- cursor glow ---------- */
var glow = document.getElementById("glow");
addEventListener("mousemove", function(e){
  mouse.x = e.clientX; mouse.y = e.clientY;
  glow.style.opacity = 1;
  glow.style.left = e.clientX+"px"; glow.style.top = e.clientY+"px";
});
document.addEventListener("mouseleave", function(){ glow.style.opacity = 0; mouse.x = mouse.y = -9999; });

/* ---------- ask box: one stateless exchange, nothing stored ---------- */
var form = document.getElementById("ask"), q = document.getElementById("q"), send = document.getElementById("send");
var ex = document.getElementById("ex"), exq = document.getElementById("exq"), exa = document.getElementById("exa");
var busy = false;

function grow(){ q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 168) + "px"; }
function sync(){ send.disabled = busy || !q.value.trim(); }
q.addEventListener("input", function(){ grow(); sync(); });
q.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); form.requestSubmit ? form.requestSubmit() : submit(e); }
});

var SAFE_HOSTS = /^(vaibhavkumar\.is-a\.dev|github\.com|linkedin\.com|www\.linkedin\.com|avsar\.pages\.dev|cyber-sahayata\.pages\.dev|fcstudio\.co\.in)$/;
function link(url){
  var a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = url.replace(/^https:\/\//, "");
  return a;
}
function renderAnswer(text){
  exa.className = ""; exa.textContent = "";
  var parts = String(text).split(/(https?:\/\/[^\s<>"'`]+)/);
  for (var i=0;i<parts.length;i++){
    var p = parts[i];
    if (!p) continue;
    if (i % 2 === 1){
      var m = p.match(/^(.*?)([.,;:!?)\]}'"]*)$/), url = m[1], tail = m[2];
      var u = null;
      try { u = new URL(url); } catch (err) { u = null; }
      if (u && u.protocol === "https:" && !u.username && !u.password && SAFE_HOSTS.test(u.hostname)) exa.appendChild(link(url));
      else exa.appendChild(document.createTextNode(url));
      if (tail) exa.appendChild(document.createTextNode(tail));
    } else exa.appendChild(document.createTextNode(p));
  }
}
function renderError(msg){
  exa.className = "err"; exa.textContent = "";
  if (msg && msg.indexOf("@") !== -1){ exa.textContent = msg; return; }
  exa.appendChild(document.createTextNode((msg || "I couldn't answer right now.") + " You can always write to "));
  var a = document.createElement("a"); a.href = "mailto:vaibhavpro9210@gmail.com"; a.textContent = "vaibhavpro9210@gmail.com";
  exa.appendChild(a); exa.appendChild(document.createTextNode("."));
}
function typing(){
  exa.className = ""; exa.textContent = "";
  var d = document.createElement("span"); d.className = "dots"; d.setAttribute("aria-label", "thinking");
  for (var i=0;i<3;i++) d.appendChild(document.createElement("i"));
  exa.appendChild(d);
}
function submit(e){
  if (e) e.preventDefault();
  var text = q.value.trim().slice(0, 400);
  if (!text || busy) return;
  busy = true; sync(); q.disabled = true;
  exq.textContent = text; ex.hidden = false; typing();
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, 30000);
  fetch(ASK, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=UTF-8"},
    body: JSON.stringify({q: text}),
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (r.ok && d && typeof d.a === "string" && d.a.trim()){ renderAnswer(d.a.trim()); q.value = ""; }
      else renderError(d && typeof d.error === "string" ? d.error : (r.status === 429 ? "That's enough questions for today." : ""));
    });
  }).catch(function(){
    renderError("I couldn't reach the answer machine.");
  }).finally(function(){
    clearTimeout(timer);
    busy = false; q.disabled = false; grow(); sync(); q.focus();
  });
}
form.addEventListener("submit", submit);

/* screenshot hook: #shot=chat shows a canned answered state, no network */
if (/[#&]shot=chat\b/.test(location.hash)){
  exq.textContent = "What has Vaibhav built?";
  ex.hidden = false;
  renderAnswer("Vaibhav is an AI and data engineer in Bangalore who builds production multi agent systems, RAG services and large scale data pipelines, and on the side he ships playful single file web toys like lemon, an LLM driven pixel art game you can try at https://vaibhavkumar.is-a.dev/lemon-experiment/.");
}

/* ---------- the wall ---------- */
var wallGrid = document.getElementById("wallgrid");
var wallStatus = document.getElementById("wallstatus");
function ago(ts){
  var s = (Date.now()-ts)/1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + "m ago";
  if (s < 86400) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
}
function renderMarks(list){
  wallGrid.textContent = "";
  list.forEach(function(e){
    var d = document.createElement("div");
    d.className = "mark";
    d.style.setProperty("--rot", ((e.id*37)%5-2)*.5 + "deg");
    var who = document.createElement("div"); who.className = "who";
    who.textContent = e.name;
    var when = document.createElement("span"); when.textContent = ago(e.ts);
    who.appendChild(when);
    var p = document.createElement("p"); p.textContent = e.msg;
    d.appendChild(who); d.appendChild(p);
    wallGrid.appendChild(d);
  });
}
function loadWall(){
  fetch(GB+"/entries").then(function(r){ return r.json(); }).then(renderMarks)
    .catch(function(){ wallStatus.textContent = "the wall is unreachable right now, it'll be back"; });
}
loadWall();
document.getElementById("wallform").addEventListener("submit", function(ev){
  ev.preventDefault();
  var msg = document.getElementById("wmsg").value.trim();
  if (msg.length < 2) return;
  var btn = document.getElementById("wallbtn");
  btn.disabled = true; wallStatus.textContent = "…";
  fetch(GB+"/entry", {method:"POST", body:JSON.stringify({
    name: document.getElementById("wname").value, msg: msg
  })}).then(function(r){
    return r.text().then(function(t){
      if (r.status === 201){ wallStatus.textContent = "it's on the wall. Thank you."; document.getElementById("wmsg").value = ""; loadWall(); }
      else wallStatus.textContent = t;
    });
  }).catch(function(){ wallStatus.textContent = "couldn't reach the wall, try again in a minute"; })
    .finally(function(){ btn.disabled = false; });
});
})();
</script>
<script>
/* anonymous visit beacon: counts loads + presence heartbeats, no cookies */
(function(){
  if (location.protocol === "file:" || location.hostname === "localhost") return;
  var EP = "https://site-analytics.vaibhavpro9210.workers.dev/ping";
  var sid = sessionStorage.getItem("va_sid");
  if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem("va_sid", sid); }
  function send(kind){
    try { navigator.sendBeacon(EP, new Blob([JSON.stringify({sid:sid, page:location.pathname, kind:kind})], {type:"text/plain"})); } catch(e){}
  }
  send("load");
  setInterval(function(){ if (document.visibilityState === "visible") send("beat"); }, 60000);
})();
</script>
