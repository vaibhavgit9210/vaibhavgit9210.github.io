<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Start here · The Plan</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* ============ tokens ============ */
:root{
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --measure: 50rem; --r: 14px;
  --blur: blur(24px) saturate(170%);
}
:root, :root[data-theme="dark"]{
  --bg:#131417; --bg-2:#181a1f;
  --card:#191b20; --card-2:#1f2228; --card-3:#23262d;
  --text:#e5e3de; --strong:#fbfaf8; --muted:#9d988f; --faint:#6f6a63;
  --line:#2a2d34; --line-soft:#22252b;
  --accent:#e9a33c; --accent-soft:rgba(233,163,60,.12); --accent-line:rgba(233,163,60,.38);
  --good:#5cb98d; --good-soft:rgba(92,185,141,.12);
  --bad:#e0655f;  --bad-soft:rgba(224,101,95,.12);
  --info:#5fb0c4; --info-soft:rgba(95,176,196,.12);
  --shadow:0 1px 2px rgba(0,0,0,.35);
  /* glass (macOS 26+): the floating header */
  --glass:rgba(27,29,34,.62);
  --rim:inset 0 .5px 0 rgba(255,255,255,.16), inset 0 0 0 .5px rgba(255,255,255,.07);
  --drop:0 10px 30px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.25);
}
:root[data-theme="light"]{
  --bg:#faf8f4; --bg-2:#f3f0e9;
  --card:#ffffff; --card-2:#f7f4ee; --card-3:#f0ece3;
  --text:#2a2822; --strong:#100f0d; --muted:#6a655d; --faint:#8e8880;
  --line:#e3ddd2; --line-soft:#ece7dd;
  --accent:#a2620c; --accent-soft:rgba(162,98,12,.08); --accent-line:rgba(162,98,12,.3);
  --good:#2f7d5b; --good-soft:rgba(47,125,91,.09);
  --bad:#b2413b;  --bad-soft:rgba(178,65,59,.09);
  --info:#2b6f83; --info-soft:rgba(43,111,131,.09);
  --shadow:0 1px 2px rgba(60,50,35,.07);
  --glass:rgba(255,255,255,.66);
  --rim:inset 0 .5px 0 rgba(255,255,255,.95), inset 0 0 0 .5px rgba(60,50,35,.12);
  --drop:0 10px 30px rgba(60,50,35,.10), 0 1px 3px rgba(60,50,35,.08);
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important;transition:none!important} }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:1.0625rem; line-height:1.62;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(1200px 700px at 50% -12%, var(--bg-2), var(--bg) 72%); }
p{ margin:0 0 .75rem; }
p:last-child{ margin-bottom:0; }
strong{ color:var(--strong); font-weight:650; }
code{ font-family:var(--mono); font-size:.84em; background:var(--card-2); border:1px solid var(--line-soft);
  border-radius:5px; padding:.08em .38em; color:var(--text); }

/* ============ links ============ */
a{ color:var(--accent); text-decoration:none; }
a.ln{ border-bottom:1px solid transparent; }
a.ln:hover{ border-bottom-color:var(--accent-line); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:5px; }

/* ============ chrome ============ */
#bar{ position:fixed; top:0; left:0; height:2px; width:0; background:var(--accent); z-index:60; transition:width .3s; }
/* a floating glass panel: the page scrolls under it */
header.top{
  position:sticky; top:max(8px, env(safe-area-inset-top)); z-index:50;
  width:min(65.5rem, calc(100% - 16px - env(safe-area-inset-left) - env(safe-area-inset-right)));
  margin:max(8px, env(safe-area-inset-top)) auto 0; border-radius:20px;
  background:var(--glass); box-shadow:var(--rim), var(--drop);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
}
@supports not (backdrop-filter: blur(1px)){ header.top{ background:var(--card); } }
@media (prefers-reduced-transparency: reduce){ header.top{ background:var(--card); backdrop-filter:none; -webkit-backdrop-filter:none; } }
.toprow{ display:flex; align-items:center; flex-wrap:wrap;
  gap:.4rem .5rem; padding:.5rem .55rem .45rem 1rem; }
.brand{ font-size:.75rem; font-weight:650; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); margin-right:auto; display:flex; align-items:center; gap:.45rem; white-space:nowrap; }
.brand .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }
@media (max-width:30rem){ .brand .bl{ display:none; } }
.btn{ display:inline-block; font-family:inherit; font-size:.72rem; font-weight:650; letter-spacing:.03em; color:var(--muted);
  background:color-mix(in srgb, var(--card-3) 70%, transparent); border:0; box-shadow:inset 0 0 0 .5px var(--line);
  border-radius:999px; padding:.34rem .78rem; cursor:pointer; white-space:nowrap; transition:color .15s, background-color .15s; }
.btn[hidden]{ display:none; }
.btn:hover{ color:var(--strong); background:var(--card-3); }
button.btn:active{ transform:scale(.97); }
.btn[aria-pressed="true"]{ color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 .5px var(--accent-line); }

nav.pages{ padding:0 .55rem .55rem;
  display:flex; gap:.3rem; overflow-x:auto; scrollbar-width:none; }
nav.pages::-webkit-scrollbar{ display:none; }
nav.pages a{ font-size:.72rem; font-weight:650; letter-spacing:.02em; color:var(--muted);
  background:color-mix(in srgb, var(--card-3) 55%, transparent); border-radius:999px;
  padding:.3rem .66rem; white-space:nowrap; display:flex; gap:.3rem; transition:color .15s, background-color .15s; }
nav.pages a span{ color:var(--faint); }
nav.pages a:hover{ color:var(--strong); background:var(--card-3); }
nav.pages a[aria-current="page"]{ color:#151107; background:var(--accent); box-shadow:inset 0 .5px 0 rgba(255,255,255,.4); }
nav.pages a[aria-current="page"] span{ color:rgba(0,0,0,.5); }

main{ max-width:var(--measure); margin:0 auto; padding:2rem clamp(.9rem,4vw,2rem) 5rem; }

/* ============ page head ============ */
.kicker{ font-size:.7rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); margin:0 0 .5rem; }
h1{ font-size:clamp(1.7rem,4.4vw,2.25rem); line-height:1.14; letter-spacing:-.015em;
  color:var(--strong); font-weight:700; margin:0 0 .6rem; }
.lede{ font-size:1.09rem; color:var(--text); max-width:38rem; margin:0 0 1.4rem; }
.frame{ display:grid; gap:.6rem; margin:0 0 1.6rem; }
@media (min-width:52rem){ .frame{ grid-template-columns:repeat(3,1fr); } }
.frame div{ background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r); padding:.7rem .85rem; }
.frame dt{ font-size:.66rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); margin:0 0 .25rem; }
.frame dd{ margin:0; font-size:.9rem; color:var(--text); line-height:1.5; }

/* ============ sections ============ */
section{ scroll-margin-top:7.5rem; margin:2.6rem 0 0; }
h2{ font-size:1.3rem; line-height:1.25; letter-spacing:-.012em; color:var(--strong); font-weight:700;
  margin:0 0 .35rem; display:flex; align-items:baseline; gap:.55rem; flex-wrap:wrap; }
h2 .num{ font-size:.78rem; font-weight:700; color:var(--accent); letter-spacing:.06em;
  background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:8px;
  padding:.1rem .4rem; position:relative; top:-.1rem; }
h2 .chip{ font-size:.68rem; font-weight:650; color:var(--muted); background:var(--card);
  border:1px solid var(--line); border-radius:999px; padding:.1rem .5rem; }
h2 .chip.full{ color:var(--good); border-color:var(--good); background:var(--good-soft); }
h3{ font-size:.72rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin:2rem 0 .6rem; padding-bottom:.35rem; border-bottom:1px solid var(--line-soft); }
.intro{ color:var(--muted); font-size:.95rem; max-width:40rem; margin:0 0 1rem; }
.intro strong{ color:var(--text); }

/* ============ tags ============ */
.tag{ display:inline-block; font-size:.63rem; font-weight:750; letter-spacing:.1em; text-transform:uppercase;
  border-radius:999px; padding:.12rem .5rem; vertical-align:.08em; white-space:nowrap;
  color:var(--muted); background:var(--card-3); border:1px solid var(--line); }
.tag.now{ color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
.tag.deadline{ color:var(--bad); background:var(--bad-soft); border-color:color-mix(in srgb,var(--bad) 40%,transparent); }
.tag.decision{ color:var(--info); background:var(--info-soft); border-color:color-mix(in srgb,var(--info) 40%,transparent); }
.tag.free{ color:var(--good); background:var(--good-soft); border-color:color-mix(in srgb,var(--good) 40%,transparent); }

/* ============ task cards ============ */
ul.tasks{ list-style:none; margin:0; padding:0; display:grid; gap:.7rem; }
li.task{ background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r);
  box-shadow:var(--shadow); padding:.85rem .95rem; }
li.task > label{ display:flex; gap:.7rem; align-items:flex-start; cursor:pointer; }
li.task input[type=checkbox]{ appearance:none; -webkit-appearance:none; flex:none;
  width:1.25rem; height:1.25rem; margin:.12rem 0 0; border:1.5px solid var(--faint);
  border-radius:50%; background:transparent; cursor:pointer; position:relative; transition:background .12s, border-color .12s; }
li.task input:checked{ background:var(--good); border-color:var(--good); }
li.task input:checked::after{ content:"✓"; position:absolute; inset:0; color:#fff; font-size:.82rem;
  font-weight:800; display:flex; align-items:center; justify-content:center; }
li.task .t{ font-weight:650; color:var(--strong); font-size:1rem; line-height:1.4; }
li.task .lead{ margin:.5rem 0 0; padding-left:1.95rem; color:var(--text); font-size:.95rem; }
li.task.done{ opacity:.5; }
li.task.done .t{ text-decoration:line-through; text-decoration-thickness:1px; }
/* the current step in a stepped card list, derived from tick state rather than typed */
li.task[data-step].is-now{ border-color:var(--accent-line); }
li.task[data-step].is-now .t::before{ content:"\25B6"; color:var(--accent); font-size:.62em;
  margin-right:.45rem; vertical-align:.14em; }
.hide-done li.task.done{ display:none; }

dl.meta{ margin:.6rem 0 0; padding-left:1.95rem; display:grid; gap:.3rem; font-size:.9rem; }
dl.meta > div{ display:grid; gap:.1rem .8rem; }
@media (min-width:34rem){ dl.meta > div{ grid-template-columns:5.2rem 1fr; } }
dl.meta dt{ font-size:.63rem; font-weight:750; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); padding-top:.28rem; }
dl.meta dd{ margin:0; color:var(--text); line-height:1.52; }
dl.meta dd.chk{ color:var(--good); }

.res{ margin:.6rem 0 0; padding-left:1.95rem; display:flex; flex-wrap:wrap; gap:.3rem; }
.res a{ font-size:.76rem; font-weight:600; color:var(--muted); background:var(--card-2);
  border:1px solid var(--line-soft); border-radius:999px; padding:.16rem .6rem; }
.res a::after{ content:" ↗"; color:var(--faint); font-size:.7em; }
.res a:hover{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
.res .lbl{ font-size:.63rem; font-weight:750; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); padding-top:.3rem; margin-right:.1rem; }

/* ============ callouts ============ */
.callout{ background:var(--card); border:1px solid var(--line); border-left:3px solid var(--muted);
  border-radius:var(--r); padding:.8rem 1rem; margin:1.1rem 0; font-size:.95rem; }
.callout > .cl{ display:block; font-size:.65rem; font-weight:750; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); margin:0 0 .35rem; }
.callout.warn{ border-left-color:var(--bad); background:var(--bad-soft); }
.callout.warn > .cl{ color:var(--bad); }
.callout.key{ border-left-color:var(--accent); background:var(--accent-soft); }
.callout.key > .cl{ color:var(--accent); }
.callout.ok{ border-left-color:var(--good); background:var(--good-soft); }
.callout.ok > .cl{ color:var(--good); }
.callout ul{ margin:.4rem 0 0; padding-left:1.1rem; }
.callout li{ margin:.28rem 0; }

/* ============ ordered rules ============ */
ol.rules{ counter-reset:r; list-style:none; margin:.8rem 0 0; padding:0; display:grid; gap:.55rem; }
ol.rules li{ counter-increment:r; position:relative; padding:.6rem .9rem .6rem 2.6rem;
  background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r); font-size:.95rem; }
ol.rules li::before{ content:counter(r); position:absolute; left:.75rem; top:.62rem;
  width:1.35rem; height:1.35rem; border-radius:50%; background:var(--accent-soft);
  border:1px solid var(--accent-line); color:var(--accent);
  font-size:.72rem; font-weight:750; display:flex; align-items:center; justify-content:center; }

/* ============ goals ============ */
ul.goals{ list-style:none; margin:.9rem 0 0; padding:0; display:grid; gap:.7rem; }
ul.goals li{ background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:.85rem 1rem; box-shadow:var(--shadow); }
ul.goals .gh{ display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; margin-bottom:.3rem; }
ul.goals .gn{ font-size:.68rem; font-weight:800; letter-spacing:.08em; color:var(--accent);
  background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:5px; padding:.08rem .35rem; }
ul.goals .gt{ font-weight:650; color:var(--strong); }
ul.goals .gd{ font-size:.78rem; color:var(--muted); margin-left:auto; white-space:nowrap; }
ul.goals p{ font-size:.93rem; margin:.15rem 0 0; }
ul.goals .grade{ font-size:.85rem; color:var(--muted); margin-top:.35rem; }
ul.goals .grade b{ font-size:.63rem; font-weight:750; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); }

/* ============ hub map ============ */
ul.map{ list-style:none; margin:.9rem 0 0; padding:0; display:grid; gap:.6rem; }
ul.map li{ background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r); overflow:hidden; }
ul.map a.mrow{ display:block; padding:.8rem .95rem; }
ul.map a.mrow:hover{ background:var(--card-2); }
ul.map .mh{ display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; }
ul.map .mn{ font-size:.68rem; font-weight:800; color:var(--faint); letter-spacing:.06em;
  border:1px solid var(--line); border-radius:5px; padding:.08rem .32rem; }
ul.map .mt{ font-weight:650; color:var(--strong); font-size:1rem; }
ul.map .mc{ font-size:.75rem; color:var(--muted); margin-left:auto; white-space:nowrap; }
ul.map .mw{ display:block; margin:.35rem 0 .3rem; font-size:.83rem; color:var(--accent); }
ul.map .md{ display:block; font-size:.9rem; color:var(--muted); line-height:1.5; }
ul.map .track{ height:3px; background:var(--line-soft); }
ul.map .fill{ height:3px; width:0; background:var(--good); transition:width .3s; }

/* ============ tables ============ */
/* wide tables get to breathe past the reading measure on large screens */
.scroll{ overflow-x:auto; margin:.9rem 0; border:1px solid var(--line-soft); border-radius:var(--r); }
@media (min-width:66rem){ .scroll{ margin-left:-4.5rem; margin-right:-4.5rem; } }
table{ border-collapse:collapse; width:100%; font-size:.88rem; min-width:34rem; }
th,td{ text-align:left; padding:.52rem .7rem; border-bottom:1px solid var(--line-soft); vertical-align:top; }
tr:last-child td{ border-bottom:0; }
th{ font-size:.64rem; font-weight:750; letter-spacing:.11em; text-transform:uppercase; color:var(--faint);
  background:var(--card-2); white-space:nowrap; }
td strong{ font-weight:650; }
td.n{ color:var(--accent); font-weight:750; width:2.2rem; text-align:center; }
/* stepped tables: the first row whose checkpoint is unticked marks where you are */
tr[data-step] td.mo{ white-space:nowrap; color:var(--muted); font-size:.82rem; position:relative; padding-left:1.5rem; }
tr[data-step] td.mo strong{ font-size:.92rem; }
tr[data-step].is-now{ background:var(--accent-soft); }
tr[data-step].is-now td.mo{ color:var(--accent); }
tr[data-step].is-now td.mo strong{ color:var(--accent); }
tr[data-step].is-now td.mo::before{ content:"\25B6"; position:absolute; left:.6rem; top:.62rem; font-size:.6rem; color:var(--accent); }
tr[data-step].is-past{ opacity:.45; }
tr[data-step].is-past td.mo::before{ content:"\2713"; position:absolute; left:.55rem; top:.5rem; font-size:.72rem; color:var(--good); }

/* ============ plain lists ============ */
ul.plain{ margin:.6rem 0; padding-left:1.15rem; font-size:.95rem; }
ul.plain li{ margin:.32rem 0; }
ul.plain li::marker{ color:var(--faint); }

/* ============ timeline ============ */
ul.tl{ list-style:none; margin:.9rem 0 0; padding:0 0 0 1.1rem; border-left:1px solid var(--line); display:grid; gap:.9rem; }
ul.tl > li{ position:relative; }
ul.tl > li::before{ content:""; position:absolute; left:-1.42rem; top:.55rem; width:7px; height:7px;
  border-radius:50%; background:var(--line); border:2px solid var(--bg); }
ul.tl > li.hot::before{ background:var(--accent); }
ul.tl .when{ font-size:.7rem; font-weight:750; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
ul.tl > li.hot .when{ color:var(--accent); }

/* ============ footer nav ============ */
.pn{ display:grid; gap:.6rem; margin:3.5rem 0 0; padding-top:1.4rem; border-top:1px solid var(--line-soft); }
@media (min-width:40rem){ .pn{ grid-template-columns:1fr 1fr; } }
.pn a{ background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r); padding:.7rem .9rem; }
.pn a:hover{ border-color:var(--accent-line); }
.pn b{ display:block; font-size:.64rem; font-weight:750; letter-spacing:.12em; text-transform:uppercase;
  color:var(--faint); margin-bottom:.15rem; }
.pn span{ color:var(--strong); font-weight:650; font-size:.95rem; }
.pn a.next{ text-align:right; }

/* ============ lock ============ */
#lock{ max-width:25rem; margin:16vh auto 0; padding:0 1.25rem; text-align:center; }
#lock .glyph{ font-size:2rem; }
#lock h1{ font-size:1.4rem; margin:.5rem 0 .3rem; }
#lock p{ color:var(--muted); font-size:.94rem; }
#lock form{ display:flex; gap:.5rem; margin-top:1.1rem; }
#lock input{ flex:1; font:inherit; font-size:max(16px,.95rem); color:var(--text); background:var(--card);
  border:0; box-shadow:inset 0 0 0 .5px var(--line); border-radius:12px; padding:.6rem .85rem; outline:none; transition:box-shadow .15s; }
#lock input:focus{ box-shadow:inset 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); }
#lock button{ font-family:inherit; font-size:.9rem; font-weight:650; color:#1a1408;
  background:var(--accent); border:0; border-radius:999px; padding:.6rem 1.15rem; cursor:pointer;
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.45); }
#lock button:active{ transform:scale(.97); }
#lock .err{ color:var(--bad); font-size:.87rem; min-height:1.4em; margin-top:.55rem; }
#lock .hint{ color:var(--faint); font-size:.8rem; margin-top:1.3rem; }
#page{ display:none; }
</style>
</head>
<body>
<div id="bar"></div>

<header class="top" id="chrome" hidden>
  <div class="toprow">
    <a class="brand" href="https://vaibhavkumar.is-a.dev/"><span class="dot"></span><span class="bl">the plan</span></a>
    <span class="btn" id="pageCount" style="cursor:default">0 of 0 done</span>
    <button class="btn" id="filterBtn" type="button" aria-pressed="false">hide done</button>
    <button class="btn" id="themeBtn" type="button">theme</button>
    <button class="btn" id="lockBtn" type="button">lock</button>
  </div>
  <nav class="pages" aria-label="pages"><a href="/plan/" aria-current="page"><span>0</span>start here</a>
<a href="/plan/today/"><span>1</span>today</a>
<a href="/plan/projects/"><span>2</span>projects</a>
<a href="/plan/exams/"><span>3</span>exams</a>
<a href="/plan/abroad/"><span>4</span>abroad</a>
<a href="/plan/long-game/"><span>5</span>long game</a>
<a href="/plan/reading/"><span>6</span>reading</a>
<a href="/plan/safety-net/"><span>7</span>safety net</a>
<a href="/plan/calendar/"><span>8</span>calendar</a></nav>
</header>

<div id="lock">
  <div class="glyph">🗺️</div>
  <h1>The Plan</h1>
  <p>This is private. Enter the passphrase to unlock every page.</p>
  <form id="unlockForm">
    <input id="pass" type="password" placeholder="passphrase" autocomplete="current-password" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <div class="err" id="err"></div>

<script>
(function(){
  var doc = document, $ = function(id){ return doc.getElementById(id); };
  var root = doc.documentElement;

  /* ---------- theme ---------- */
  try{
    var t = localStorage.getItem('mp-theme');
    if (t) root.setAttribute('data-theme', t);
    else if (matchMedia('(prefers-color-scheme: light)').matches) root.setAttribute('data-theme','light');
  }catch(e){}
  $('themeBtn').addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('mp-theme', next); }catch(e){}
  });

  /* ---------- crypto ---------- */
  var blob = JSON.parse($('blob').textContent);
  function b64(s){ var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  function decrypt(pass){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:b64(blob.salt), iterations:blob.iter, hash:'SHA-256' },
          km, { name:'AES-GCM', length:256 }, false, ['decrypt']); })
      .then(function(key){ return crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(blob.iv) }, key, b64(blob.ct)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }

  /* ---------- tick state (shared across every page) ---------- */
  var TICKS = 'mp-ticks';
  function load(){ try{ return JSON.parse(localStorage.getItem(TICKS)) || {}; }catch(e){ return {}; } }
  function save(m){ try{ localStorage.setItem(TICKS, JSON.stringify(m)); }catch(e){} }

  function manifest(){
    var el = $('manifest');
    if (!el) return null;
    try{ return JSON.parse(el.textContent); }catch(e){ return null; }
  }

  function refresh(){
    var boxes = doc.querySelectorAll('#body input[data-ck]');
    var done = 0;
    boxes.forEach(function(b){
      if (b.checked) done++;
      var card = b.closest('.task');
      if (card) card.classList.toggle('done', b.checked);
    });

    /* per-section counters */
    doc.querySelectorAll('#body section[data-sec]').forEach(function(sec){
      var chip = sec.querySelector('[data-chip]');
      if (!chip) return;
      var all = sec.querySelectorAll('input[data-ck]'), d = 0;
      all.forEach(function(b){ if (b.checked) d++; });
      if (!all.length){ chip.remove(); return; }
      chip.textContent = d + ' of ' + all.length;
      chip.classList.toggle('full', d === all.length);
    });

    /* hub map + whole-plan total */
    var man = manifest(), ticks = load(), total = 0, tdone = 0;

    /* stepped tables: ticked rows fade, the first unticked one gets the "you are here" arrow */
    doc.querySelectorAll('#body [data-steps]').forEach(function(tbl){
      var marked = false;
      tbl.querySelectorAll('[data-step]').forEach(function(row){
        var done = !!ticks[row.dataset.step];
        row.classList.toggle('is-past', done);
        row.classList.toggle('is-now', !done && !marked);
        if (!done) marked = true;
      });
    });
    if (man){
      Object.keys(man).forEach(function(slug){
        var ids = man[slug] || [], d = ids.filter(function(i){ return ticks[i]; }).length;
        total += ids.length; tdone += d;
        var row = doc.querySelector('#body [data-map="' + slug + '"]');
        if (!row) return;
        var c = row.querySelector('[data-map-count]'), f = row.querySelector('[data-map-fill]');
        if (c) c.textContent = ids.length ? (d + ' of ' + ids.length) : 'no checkpoints';
        if (f) f.style.width = (ids.length ? d/ids.length*100 : 0) + '%';
      });
    }

    var tight = matchMedia('(max-width: 34rem)').matches;
    var head = boxes.length
      ? (tight ? (done + ' / ' + boxes.length) : (done + ' of ' + boxes.length + ' on this page'))
      : (man ? (tight ? (tdone + ' / ' + total) : (tdone + ' of ' + total + ' in the whole plan')) : '');
    $('pageCount').textContent = head;
    $('pageCount').hidden = !head;
    var pct = boxes.length ? done/boxes.length : (total ? tdone/total : 0);
    $('bar').style.width = (pct*100) + '%';
  }

  /* ---------- date helpers ---------- */
  var DAY = 864e5;
  function ist(d){ return new Date(d + 'T00:00:00+05:30').getTime(); }
  function stamp(){
    var now = Date.now();
    doc.querySelectorAll('#body [data-since]').forEach(function(el){
      var d = Math.floor((now - ist(el.dataset.since)) / DAY) + 1;
      if (d > 0) el.textContent = d;
    });
    doc.querySelectorAll('#body [data-until]').forEach(function(el){
      var d = Math.round((ist(el.dataset.until) - now) / DAY);
      el.textContent = d > 1 ? ('in ' + d + ' days') : d === 1 ? 'tomorrow'
                     : d === 0 ? 'today' : d === -1 ? 'yesterday' : (Math.abs(d) + ' days ago');
      if (d < 0) el.style.color = 'var(--faint)';
    });
  }

  /* ---------- render ---------- */
  function show(html){
    $('body').innerHTML = html;
    $('lock').style.display = 'none';
    $('page').style.display = 'block';
    $('chrome').hidden = false;
    stamp();
    var ticks = load();
    doc.querySelectorAll('#body input[data-ck]').forEach(function(b){
      b.checked = !!ticks[b.dataset.ck];
      b.addEventListener('change', function(){
        var m = load();
        if (b.checked) m[b.dataset.ck] = 1; else delete m[b.dataset.ck];
        save(m); refresh();
      });
    });
    refresh();
    if (location.hash && location.hash.indexOf('key=') === -1){
      var target = doc.querySelector(location.hash);
      if (target) target.scrollIntoView();
    }
  }

  /* ---------- hide-done filter ---------- */
  function applyFilter(on){
    $('body').classList.toggle('hide-done', on);
    $('filterBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('filterBtn').textContent = on ? 'show all' : 'hide done';
  }
  var hidden = false;
  try{ hidden = localStorage.getItem('mp-hidedone') === '1'; }catch(e){}
  $('filterBtn').addEventListener('click', function(){
    hidden = !hidden;
    try{ localStorage.setItem('mp-hidedone', hidden ? '1' : '0'); }catch(e){}
    applyFilter(hidden);
  });
  applyFilter(hidden);

  /* ---------- unlock ---------- */
  function attempt(pass, remember){
    return decrypt(pass).then(function(html){
      if (remember) try{ localStorage.setItem('mp-key', pass); }catch(e){}
      show(html); return true;
    }).catch(function(){ return false; });
  }
  $('lockBtn').addEventListener('click', function(){
    try{ localStorage.removeItem('mp-key'); }catch(e){}
    location.hash = ''; location.reload();
  });
  $('unlockForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var p = $('pass').value.trim();
    if (!p) return;
    $('err').textContent = '';
    attempt(p, true).then(function(ok){ if (!ok) $('err').textContent = 'Wrong passphrase.'; });
  });

  var m = location.hash.match(/key=([^&]+)/), saved = null;
  try{ saved = localStorage.getItem('mp-key'); }catch(e){}
  if (m) attempt(decodeURIComponent(m[1]), true);
  else if (saved) attempt(saved, false);
})();
</script>
<script>
/* anonymous visit beacon */
(function(){
  if (location.protocol === "file:" || location.hostname === "localhost") return;
  var EP = "https://site-analytics.vaibhavpro9210.workers.dev/ping";
  var sid = sessionStorage.getItem("va_sid");
  if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem("va_sid", sid); }
  function send(kind){
    try { navigator.sendBeacon(EP, new Blob([JSON.stringify({sid:sid, page:location.pathname, kind:kind})], {type:"text/plain"})); } catch(e){}
  }
  send("load");
  setInterval(function(){ if (document.visibilityState === "visible") send("beat"); }, 60000);
})();
</script>
